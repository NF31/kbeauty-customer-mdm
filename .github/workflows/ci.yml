name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la meme branche annule le run precedent, devenu inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint + Tests (Go 1.27)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Installer Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Format (gofmt)
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Fichiers non formates :"
            echo "$diff"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Build
        run: go build ./...
